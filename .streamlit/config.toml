# Console settings (local runs and the Docker image). The app makes no network calls of its own:
# no usage statistics, and serverAddress is set so a headless start does not look up the external IP.
[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
headless = true
maxUploadSize = 20  # MB; a 12-hour replay file is about 1 MB

[client]
toolbarMode = "minimal"

# Light "control room" look (docs/CONSOLE_DESIGN.md): pale cool page, white surfaces, deep navy text,
# one accent blue for links and primary buttons. Semantic colours live in raqeeb/ui/app.py (SEMANTIC)
# and always carry a word beside them.
[theme]
base = "light"
primaryColor = "#1b2f4a"
backgroundColor = "#f6f2ea"
secondaryBackgroundColor = "#efe9dc"
textColor = "#1d1f22"
linkColor = "#8a4b00"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "0.6rem"
borderColor = "#dedad2"
showWidgetBorder = true
